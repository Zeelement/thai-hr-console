<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人事工作台 · HR Workbench</title>
<link rel="stylesheet" href="styles.css">
<style>
/* 登录外壳（Vue 挂载前即可生效） */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f6f8}
.login-card{width:340px;background:#fff;border:1px solid #e3e8ec;border-radius:14px;padding:30px 28px;box-shadow:0 10px 30px rgba(15,30,45,.08)}
.login-logo{width:44px;height:44px;border-radius:11px;background:#0f7a55;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.5px;margin-bottom:16px}
.login-title{font-size:19px;font-weight:650;color:#14171c}
.login-sub{font-size:12px;color:#7b8794;margin:4px 0 22px}
.login-label{display:block;font-size:12px;font-weight:600;color:#3d4852;margin:0 0 12px}
.login-label .input{width:100%;margin-top:6px}
.login-error{background:#fff2f0;border:1px solid #ffccc7;color:#cf3c32;border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:12px}
.login-btn{width:100%;height:38px}
.login-foot{font-size:11px;color:#9aa4ae;text-align:center;margin-top:16px}
.boot{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#7b8794;font-size:13px}
</style>
</head>
<body>

<div id="app"></div>

<script src="vendor/vue.global.prod.js"></script>
<script src="data.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
<script src="main.js"></script>
</body>
</html>
